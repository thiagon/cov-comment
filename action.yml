name: Cov Comment
description: Comment PR coverage with a badge and baseline diff, and publish an offline HTML report
author: thiagon
branding:
  icon: percent
  color: green

inputs:
  lcov-file:
    description: Path to the lcov file
    required: true
  baseline-file:
    description: Path to a baseline lcov file, overrides the automatic baseline
    default: ''
  baseline-branch:
    description: Branch whose latest successful run provides the baseline
    default: main
  title:
    description: Comment and report title
    default: Coverage Report
  minimum-coverage:
    description: Fail when total line coverage is below this percentage
    default: '0'
  thresholds:
    description: Green and yellow cutoffs in percent, as green,yellow
    default: '90,70'
  emojis:
    description: Emojis for green, yellow, red and no data, as four comma separated values
    default: 🟢,🟡,🔴,⚪
  hide-fully-covered:
    description: Hide files with 100% coverage from the all files list and the HTML report, changed files are always listed
    default: 'false'
  html-name:
    description: File name of the HTML report, also the artifact name
    default: coverage.html
  github-token:
    description: Token used to post the PR comment
    default: ${{ github.token }}

outputs:
  total-coverage:
    description: Total line coverage percentage
    value: ${{ steps.report.outputs.total-coverage }}
  report-url:
    description: URL of the HTML report artifact
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - if: github.event_name == 'push' && github.ref_name == inputs.baseline-branch
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cov-comment-publish"
        cp "${{ inputs.lcov-file }}" "$RUNNER_TEMP/cov-comment-publish/lcov.info"
    - if: github.event_name == 'push' && github.ref_name == inputs.baseline-branch
      uses: actions/upload-artifact@v7
      with:
        name: cov-comment-baseline
        path: ${{ runner.temp }}/cov-comment-publish/lcov.info
        overwrite: true
    - id: baseline
      if: github.event_name == 'pull_request' && inputs.baseline-file == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" --branch "${{ inputs.baseline-branch }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
    - if: steps.baseline.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: cov-comment-baseline
        path: ${{ runner.temp }}/cov-comment-baseline
        run-id: ${{ steps.baseline.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - id: report
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.js" report
      env:
        INPUT_LCOV_FILE: ${{ inputs.lcov-file }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline-file || format('{0}/cov-comment-baseline/lcov.info', runner.temp) }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_HTML_NAME: ${{ inputs.html-name }}
        INPUT_HIDE_FULLY_COVERED: ${{ inputs.hide-fully-covered }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    - id: upload
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.report.outputs.html-path }}
        archive: false
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.js" comment
      env:
        INPUT_LCOV_FILE: ${{ inputs.lcov-file }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline-file || format('{0}/cov-comment-baseline/lcov.info', runner.temp) }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_HTML_NAME: ${{ inputs.html-name }}
        INPUT_THRESHOLDS: ${{ inputs.thresholds }}
        INPUT_EMOJIS: ${{ inputs.emojis }}
        INPUT_HIDE_FULLY_COVERED: ${{ inputs.hide-fully-covered }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.js" gate
      env:
        INPUT_LCOV_FILE: ${{ inputs.lcov-file }}
        INPUT_HTML_NAME: ${{ inputs.html-name }}
        INPUT_MINIMUM_COVERAGE: ${{ inputs.minimum-coverage }}
